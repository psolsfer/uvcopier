# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
# and https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
# for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
    os: ubuntu-24.04
    tools:
        python: "3.13"
    jobs:
        create_environment:
            # Install uv using asdf
            - asdf plugin add uv
            - asdf install uv latest
            - asdf global uv latest
            # Create a virtual environment
            - uv venv
        install:
         # Install dependencies with docs using uv
            - uv install --group docs

# Build documentation in the docs/ directory with Zensical
zensical:
    configuration: mkdocs.yml
